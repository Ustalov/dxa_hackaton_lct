name: Publish selected weights
on:
  push:
    paths: [".github/workflows/publish-weights.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify the approved model bundle
        run: |
          curl --fail --location --retry 3 --max-time 900 'https://equally-laws-towards-knight.trycloudflare.com/dxa-runtime.tar.gz' -o dxa-runtime.tar.gz
          echo '75610644fe4c59c04414fda9420c87f039cb23548fa7198d0b9215cf350aef3f  dxa-runtime.tar.gz' > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish model weights
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view models-v1 >/dev/null 2>&1 || gh release create models-v1 --target main --title 'Selected DXA models' --notes 'Seven selected weights and runtime configurations. No source DICOMs or login credentials. Extract runtime-data/ into the repository root before building Docker.'
          gh release upload models-v1 dxa-runtime.tar.gz SHA256SUMS --clobber
