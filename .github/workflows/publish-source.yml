name: Publish verified submission
on:
  push:
    paths: [".github/workflows/publish-source.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download approved source bundle
        run: |
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 'https://larjz-5-180-97-242.free.pinggy.net/dxa-source.tar.gz' -o /tmp/dxa-source.tar.gz
          echo '2db5c811de88aa29620c570ce5983d38dec6254f615362f568a91d93c9b237c3  /tmp/dxa-source.tar.gz' | sha256sum --check
          tar --no-same-owner -xzf /tmp/dxa-source.tar.gz
      - name: Commit reviewed deliverables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore .dockerignore Dockerfile requirements*.txt run.sh dxa web vendor scripts tests docs reports
          git diff --cached --quiet || git commit -m 'Publish tested DXA prototype, reproducible deployment, reports and presentation'
          git push origin HEAD:main
